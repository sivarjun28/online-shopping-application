spring:
  datasource:
    url: jdbc:mysql://localhost:3306/esa_db?createDatabaseIfNotExist=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${mail.username}
    password: ${mail.password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
        debug: true

application:
  jwt:
    secret: ${jwt.secret}
    access_expiry_seconds: 3600
    refresh_expiry_seconds: 1296000
  cookie:
    domain: localhost
    same_site: Lax
    secure: false
